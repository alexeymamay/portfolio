name: fetch-media
on:
  push:
    paths: ['.github/workflows/fetch-media.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Dynamic Island media from Webflow assets
        run: |
          set -e
          mkdir -p images/dynamic-island videos/dynamic-island
          B=https://s3.amazonaws.com/webflow-prod-assets/6837cc03dba75b26a136cb91
          curl -fsSL "$B/6906e0ac634217da7e9ee894_Screenshot%202025-11-01%20at%209.39.49%E2%80%AFPM.png" -o images/dynamic-island/state-diagram.png
          curl -fsSL "$B/690980b74e9b8d3be98ad6a2_jindos.png" -o images/dynamic-island/redlines.png
          curl -fsSL "$B/6906d030f9d2a792229ff520_noun-pain-4525626.svg" -o images/dynamic-island/icon-pain.svg
          curl -fsSL "$B/6906d030e20b5f65047fb5e2_noun-goal-8108177.svg" -o images/dynamic-island/icon-intent.svg
          curl -fsSL "$B/6906aad4b8defa5a8fbc92eb_di-1.mp4" -o videos/dynamic-island/di-1.mp4
          curl -fsSL "$B/69091c78b0b6eecebccff990_google_slide_2_d_ii.mp4" -o videos/dynamic-island/motion-system.mp4
          curl -fsSL "$B/690a767c06de5d64c71b4f2e_artifacts_1_compressed.mp4" -o videos/dynamic-island/artifacts.mp4
          curl -fsSL "$B/690abd7c08f8f94fb917377e_motion_pieces.mp4" -o videos/dynamic-island/base-rig.mp4
          curl -fsSL "$B/690a7102eeb0d6ef678cdfe7_artifacts.mp4" -o videos/dynamic-island/artifacts-short.mp4
          curl -fsSL "$B/6906d66f570989703315c066_squircles_1.mp4" -o videos/dynamic-island/squircles-1.mp4
          ls -la images/dynamic-island videos/dynamic-island
      - name: Commit media and remove this workflow
        run: |
          git config user.name "Alexey Mamay"
          git config user.email "alexey.mamay@icloud.com"
          git rm -q .github/workflows/fetch-media.yml
          git add images/dynamic-island videos/dynamic-island
          git commit -m "Add Dynamic Island media from Webflow assets"
          git push
