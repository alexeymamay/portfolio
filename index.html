        raw = bits; return decryptWith(bits);
      }).then(function (html) {
        try { localStorage.setItem(STORE, toB64(raw)); } catch (e) {}
        proceed(html);
      }, function () {
        err.textContent = "Incorrect password. Please try again.";
        go.disabled = false; go.textContent = "Access portfolio";
      });
    });
  })();
  </script>
</body>
